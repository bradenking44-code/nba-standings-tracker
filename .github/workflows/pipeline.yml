name: Daily NBA standings tracker

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nba-daily-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tracker
        run: python -m pip install .
      - name: Collect standings and rebuild history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m nba_tracker.pipeline
      - name: Commit daily raw snapshot and outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/history.csv data/status.json data/daily_issue.md
          if ! git diff --cached --quiet; then
            git commit -m "Update NBA standings for $(date -u +%F)"
            git push
          fi

