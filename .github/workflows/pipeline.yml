name: Daily NBA standings tracker

on:
  schedule:
    # Morning collection plus same-day recovery windows (UTC).
    - cron: "17 12,18,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nba-daily-pipeline
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check whether today's standings are complete
        id: check
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          status_path = Path("data/status.json")
          status = json.loads(status_path.read_text()) if status_path.exists() else {}
          today = datetime.now(timezone.utc).date().isoformat()
          sources = status.get("sources", [])
          complete = (
              status.get("latest_snapshot_date") == today
              and status.get("items") == 30
              and any(source.get("ok") and source.get("count") == 30 for source in sources)
          )
          print(f"Today's standings complete: {complete}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={'true' if complete else 'false'}\n")
          PY

  collect:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tracker
        run: python -m pip install .
      - name: Collect standings and rebuild history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m nba_tracker.pipeline
      - name: Commit daily raw snapshot and outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/history.csv data/status.json data/daily_issue.md
          if ! git diff --cached --quiet; then
            git commit -m "Update NBA standings for $(date -u +%F)"
            git push
          fi

